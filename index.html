        window.addQuestion = function(type) {
            document.getElementById('fabMenu').classList.remove('show'); 
            if (lessonData.questions.length >= 30) { alert("Tối đa 30 câu hỏi!"); return; }
            let id = "q" + Date.now() + Math.floor(Math.random()*1000); 
            let newQ = {};
            if(type === 'single') newQ = { id, type, img: "", pts: 1, q: "Câu hỏi trắc nghiệm mới", expl: "", opts: ["A", "B", "C"], ans: 0 };
            else if(type === 'multi') newQ = { id, type, img: "", pts: 1, q: "Câu nhiều đáp án mới", expl: "", opts: ["Lựa chọn 1", "Lựa chọn 2", "Lựa chọn 3"], ans: [0] };
            else if(type === 'fill') newQ = { id, type, img: "", pts: 1, pre: "Trước", post: "Sau", expl: "", ans: "đáp án" };
            else if(type === 'typing') newQ = { id, type, img: "", pts: 1, q: "Gõ lại đoạn văn và định dạng:", expl: "", sample: "Văn bản mẫu.", reqBold: false, reqItalic: false, reqUnderline: false, reqColor: false, reqAlign: "", reqFont: "" };
            else if(type === 'match') newQ = { id, type, img: "", pts: 1, q: "Nối các cặp", expl: "", pairs: [{l:"Trái 1", r:"Phải 1"}, {l:"Trái 2", r:"Phải 2"}] };
            else if(type === 'sort') newQ = { id, type, img: "", pts: 1, q: "Kéo thả để sắp xếp", expl: "", items: ["Bước 1", "Bước 2", "Bước 3"] };
            else if(type === 'group') newQ = { id, type, img: "", pts: 1, q: "Kéo thả phân loại", expl: "", b1: "Nhóm 1", b2: "Nhóm 2", items: [{txt:"Thẻ 1", b:1}, {txt:"Thẻ 2", b:2}, {txt:"Thẻ 3", b:1}, {txt:"Thẻ 4", b:2}] };
            else if(type === 'draw') newQ = { id, type, img: "", pts: 0, q: "Em hãy vẽ một bức tranh", expl: "" };
            
            saveCurrentAdminState(); lessonData.questions.push(newQ); renderAdminQuestions();
        }

        window.removeQuestion = function(index) {
            if(confirm("Xóa câu hỏi này?")) { saveCurrentAdminState(); lessonData.questions.splice(index, 1); renderAdminQuestions(); }
        }

        function saveCurrentAdminState() {
            lessonData.meta.internalName = document.getElementById('cfg_internalName').value || lessonData.meta.title;
            lessonData.meta.category = document.getElementById('cfg_category').value || "Chưa phân loại";

            lessonData.questions.forEach((q, i) => {
                let elExpl = document.getElementById(`cfg_${i}_expl`); if(elExpl) q.expl = elExpl.value;
                let elPts = document.getElementById(`cfg_${i}_pts`); if(elPts) q.pts = parseFloat(elPts.value) || 0;
                let elImg = document.getElementById(`cfg_${i}_img`); if(elImg) q.img = elImg.value;

                if(q.type === 'single') {
                    let elQ = document.getElementById(`cfg_${i}_q`); if(!elQ) return; q.q = elQ.value;
                    q.opts = q.opts.map((_, j) => document.getElementById(`cfg_${i}_opt${j}`).value);
                    q.ans = parseInt(document.getElementById(`cfg_${i}_ans`).value);
                } else if(q.type === 'multi') {
                    let elQ = document.getElementById(`cfg_${i}_q`); if(!elQ) return; q.q = elQ.value;
                    q.opts = q.opts.map((_, j) => document.getElementById(`cfg_${i}_opt${j}`).value);
                    q.ans = []; q.opts.forEach((_, j) => { if(document.getElementById(`cfg_${i}_chk${j}`).checked) q.ans.push(j); });
                } else if(q.type === 'fill') {
                    let elPre = document.getElementById(`cfg_${i}_pre`); if(!elPre) return; q.pre = elPre.value;
                    q.ans = document.getElementById(`cfg_${i}_ans`).value; q.post = document.getElementById(`cfg_${i}_post`).value;
                } else if(q.type === 'typing') {
                    let elQ = document.getElementById(`cfg_${i}_q`); if(!elQ) return; q.q = elQ.value;
                    
                    // Lưu văn bản mẫu từ trình soạn thảo
                    q.sample = document.getElementById(`cfg_${i}_sample`).innerHTML;
                    
                    q.reqBold = document.getElementById(`cfg_${i}_reqBold`)?.checked || false;
                    q.reqItalic = document.getElementById(`cfg_${i}_reqItalic`)?.checked || false;
                    q.reqUnderline = document.getElementById(`cfg_${i}_reqUnderline`)?.checked || false;
                    q.reqColor = document.getElementById(`cfg_${i}_reqColor`)?.checked || false;
                    q.reqAlign = document.getElementById(`cfg_${i}_reqAlign`)?.value || "";
                    q.reqFont = document.getElementById(`cfg_${i}_reqFont`)?.value || "";
                } else if(q.type === 'match') {
                    let elQ = document.getElementById(`cfg_${i}_q`); if(!elQ) return; q.q = elQ.value;
                    for(let j=0; j<q.pairs.length; j++) {
                        q.pairs[j].l = document.getElementById(`cfg_${i}_l${j}`).value;
                        q.pairs[j].r = document.getElementById(`cfg_${i}_r${j}`).value;
                    }
                } else if(q.type === 'sort') {
                    let elQ = document.getElementById(`cfg_${i}_q`); if(!elQ) return; q.q = elQ.value;
                    q.items = q.items.map((_, j) => document.getElementById(`cfg_${i}_i${j}`).value);
                } else if(q.type === 'group') {
                    let elQ = document.getElementById(`cfg_${i}_q`); if(!elQ) return; q.q = elQ.value;
                    q.b1 = document.getElementById(`cfg_${i}_b1`).value; q.b2 = document.getElementById(`cfg_${i}_b2`).value;
                    for(let j=0; j<q.items.length; j++) {
                        q.items[j].txt = document.getElementById(`cfg_${i}_i${j}_t`).value;
                        q.items[j].b = parseInt(document.getElementById(`cfg_${i}_i${j}_b`).value);
                    }
                } else if(q.type === 'draw') {
                    let elQ = document.getElementById(`cfg_${i}_q`); if(!elQ) return; q.q = elQ.value;
                }
            });
        }

        window.saveAdminData = function(isExport = false) {
            lessonData.meta.title = document.getElementById('cfg_title').value;
            lessonData.meta.subtitle = document.getElementById('cfg_subtitle').value;
            lessonData.meta.objectives = document.getElementById('cfg_obj').value.replace(/\n/g, "<br>");
            lessonData.meta.timeLimit = parseInt(document.getElementById('cfg_time').value) || 0;
            lessonData.meta.shuffle = document.getElementById('cfg_shuffle').value === "true";
            
            saveCurrentAdminState(); library[currentLessonId] = JSON.parse(JSON.stringify(lessonData));
            try { localStorage.setItem('libUltimateFixV13', JSON.stringify(library)); } catch(e){}
            
            if(!isExport) {
                alert("✅ Đã lưu cấu hình bài tập vào Thư viện!");
                document.getElementById('adminPanel').style.display = "none";
                let fab = document.getElementById('adminFab'); if(fab) fab.style.display = 'none';
                let mainContainer = document.getElementById('mainContainer'); if(mainContainer) mainContainer.style.maxWidth = "850px";
                renderLibrary(); renderApp();
            }
        }

        window.downloadBackupJSON = function() {
            saveCurrentAdminState(); library[currentLessonId] = JSON.parse(JSON.stringify(lessonData));
            try { localStorage.setItem('libUltimateFixV13', JSON.stringify(library)); } catch(e){}
            let dataStr = JSON.stringify(library, null, 2); let blob = new Blob([dataStr], {type: "application/json"});
            let link = document.createElement("a"); link.href = URL.createObjectURL(blob); link.download = "ThuVien_PhieuBaiTap.json"; link.click();
        }

        window.importBackupJSON = function(event) {
            let file = event.target.files[0]; if (!file) return; let reader = new FileReader();
            reader.onload = function(e) {
                try {
                    let importedLib = JSON.parse(e.target.result);
                    if(typeof importedLib === 'object' && Object.keys(importedLib).length > 0) {
                        library = importedLib; currentLessonId = Object.keys(library)[0];
                        try { localStorage.setItem('libUltimateFixV13', JSON.stringify(library)); localStorage.setItem('activeUltimateFixV13', currentLessonId); } catch(err){}
                        lessonData = JSON.parse(JSON.stringify(library[currentLessonId])); renderLibrary(); populateAdminForm(); alert("Phục hồi thành công!");
                    } else { alert("File JSON không hợp lệ!"); }
                } catch(err) { alert("Lỗi đọc file!"); }
            }; reader.readAsText(file); event.target.value = ''; 
        }

        window.exportHTML = function() {
            saveAdminData(true); 
            let htmlCopy = document.documentElement.cloneNode(true);
            let adminPanelEl = htmlCopy.querySelector('#adminPanel'); if(adminPanelEl) adminPanelEl.remove();
            let teacherBtnEl = htmlCopy.querySelector('#teacherBtn'); if(teacherBtnEl) teacherBtnEl.remove();
            let fabEl = htmlCopy.querySelector('#adminFab'); if(fabEl) fabEl.remove();
            let mainContainer = htmlCopy.querySelector('#mainContainer'); if(mainContainer) mainContainer.style.maxWidth = "800px";

            htmlCopy.querySelector('#app').innerHTML = ''; 
            let timerEl = htmlCopy.querySelector('#timerDisplay'); if(timerEl) timerEl.style.display = 'none';

            let dataScript = htmlCopy.querySelector('#injected-data');
            dataScript.textContent = JSON.stringify(lessonData).replace(/</g, '\\u003c');
            
            let finalHTML = "<!DOCTYPE html>\n" + htmlCopy.outerHTML;
            let blob = new Blob([finalHTML], {type: "text/html;charset=utf-8"});
            let link = document.createElement("a"); link.href = URL.createObjectURL(blob);
            let safeTitle = (lessonData.meta.internalName || lessonData.meta.title).replace(/[^a-zA-Z0-9]/gi, '_').toLowerCase();
            link.download = `Phieu_${safeTitle}.html`; link.click();
        }

        function startTimer(minutes) {
            clearInterval(timerInterval); let timeRemaining = minutes * 60; let timerEl = document.getElementById('timerDisplay'); timerEl.style.display = 'block';
            let updateDisplay = () => { let m = Math.floor(timeRemaining / 60); let s = timeRemaining % 60; timerEl.innerText = `⏳ ${m}:${s<10?'0':''}${s}`; };
            updateDisplay();
            timerInterval = setInterval(() => {
                if(isSubmitted) { clearInterval(timerInterval); timerEl.style.display = 'none'; return; }
                timeRemaining--; updateDisplay();
                if(timeRemaining <= 0) { clearInterval(timerInterval); timerEl.style.display = 'none'; alert("⏰ Đã hết thời gian! Hệ thống tự động nộp bài."); gradeTest(); }
            }, 1000);
        }

        function renderApp() {
            isSubmitted = false; userAnswers = {}; const app = document.getElementById('app');
            
            if(isStudentMode) { 
                let tBtn = document.getElementById('teacherBtn'); if(tBtn) tBtn.remove();
                let fBtn = document.getElementById('adminFab'); if(fBtn) fBtn.remove();
                let aPanel = document.getElementById('adminPanel'); if(aPanel) aPanel.remove();
            }
            if(lessonData.meta.timeLimit > 0) startTimer(lessonData.meta.timeLimit); else { clearInterval(timerInterval); document.getElementById('timerDisplay').style.display = 'none'; }

            let html = `
                <div id="quizContainer">
                    <h1>${lessonData.meta.title}</h1>
                    <h3 class="subtitle">${lessonData.meta.subtitle}</h3>
                    <div class="mascot-container"><div class="mascot-emoji">${lessonData.meta.mascotEmoji}</div><div class="mascot-bubble">${lessonData.meta.mascotText}</div></div>
                    <div class="student-info">
                        <input type="text" id="studentName" placeholder="👦👧 Họ và tên của em...">
                        <input type="text" id="studentClass" placeholder="🏫 Em học Lớp mấy? (VD: 3A, 4B)...">
                    </div>
                    <div class="objectives">🎯 <strong>Mục tiêu bài học:</strong><br>${lessonData.meta.objectives}</div>
            `;

            let displayQ = [...lessonData.questions];
            if(lessonData.meta.shuffle) displayQ.sort(() => Math.random() - 0.5);

            displayQ.forEach((q, idx) => {
                let pointTag = q.type !== 'draw' ? `(${q.pts || 0} điểm)` : "(Không tính điểm)";
                html += `<div class="section"><h2 class="section-title"><span>Câu ${idx+1}</span> <span style="font-size:14px; color:#747d8c; font-weight:normal; background:#f1f2f6; padding: 4px 10px; border-radius: 10px;">${pointTag}</span></h2>`;
                
                let imgDisplay = (q.img && q.img.trim() !== "") ? `<img src="${q.img}" class="question-img" alt="Minh họa câu hỏi">` : "";

                if (q.type === 'single') {
                    html += `<p style="font-size: 17px; color: #2f3542;"><strong>${q.q}</strong></p> ${imgDisplay} <div class="options" id="${q.id}">`;
                    q.opts.forEach((opt, j) => { if(opt.trim() !== "") html += `<button class="option-btn" onclick="selectSingle('${q.id}', this, ${j})">${opt}</button>`; });
                    html += `</div>`;
                } 
                else if (q.type === 'multi') {
                    html += `<p style="font-size: 17px; color: #2f3542;"><strong>${q.q}</strong></p> ${imgDisplay} <div class="options" id="${q.id}">`;
                    q.opts.forEach((opt, j) => { if(opt.trim() !== "") html += `<button class="option-btn" onclick="toggleMulti('${q.id}', this, ${j})">⬜ ${opt}</button>`; });
                    html += `</div>`; userAnswers[q.id] = []; 
                }
                else if (q.type === 'fill') { html += `${imgDisplay} <div class="fill-blank-row"><strong>${q.pre}</strong> <input type="text" id="${q.id}"> <strong>${q.post}</strong></div>`; }
                else if (q.type === 'typing') {
                    let reqs = [];
                    if(q.reqBold) reqs.push("<b>In đậm</b>");
                    if(q.reqItalic) reqs.push("<i>In nghiêng</i>");
                    if(q.reqUnderline) reqs.push("<u>Gạch chân</u>");
                    if(q.reqColor) reqs.push("🎨 Đổi màu chữ");
                    if(q.reqAlign === 'center') reqs.push("↔️ Căn giữa");
                    if(q.reqAlign === 'right') reqs.push("➡️ Căn phải");
                    if(q.reqAlign === 'justify') reqs.push("🔠 Căn đều hai bên");
                    if(q.reqFont) reqs.push(`Phông chữ <b>${q.reqFont}</b>`);
                    
                    let reqHtml = reqs.length > 0 ? `<div style="background:#fff3cd; color:#d35400; padding:10px 15px; border-radius:8px; margin-bottom:15px; font-size:15px; border-left:4px solid #f1c40f;"><b>🎯 Yêu cầu:</b> Em hãy gõ lại đoạn văn dưới đây và nhớ định dạng: ${reqs.join(", ")}</div>` : "";

                    // Hiển thị Văn bản mẫu (q.sample giờ đã chứa định dạng HTML do giáo viên soạn)
                    html += `<p style="font-size: 17px; color: #2f3542;"><strong>${q.q}</strong></p> ${imgDisplay} 
                    <div class="sample-text" style="font-weight:normal; font-family:inherit;">${q.sample}</div> 
                    ${reqHtml}
                    <div class="rich-text-wrapper">
                        ${getRichToolbar(q.id)}
                        <div id="${q.id}" class="rich-editor" contenteditable="true" placeholder="Em hãy nhấp vào đây để gõ và trình bày nội dung..."></div>
                    </div>`;
                }
                else if (q.type === 'match') {
                    html += `<p style="font-size: 17px; color: #2f3542;"><strong>${q.q}</strong></p> ${imgDisplay}`;
                    let rightOptions = q.pairs.map(p => p.r).filter(r => r.trim()!=="").sort(() => Math.random() - 0.5);
                    q.pairs.forEach((p, j) => {
                        if(p.l.trim() !== "") {
                            html += `<div class="match-row">
                                <strong>${p.l}</strong>
                                <select id="${q.id}_${j}"><option value="">-- Chọn đáp án --</option>${rightOptions.map(r => `<option value="${r}">${r}</option>`).join('')}</select>
                            </div>`;
                        }
                    });
                }
                else if (q.type === 'sort') {
                    html += `<p style="font-size: 17px; color: #2f3542;"><strong>${q.q}</strong></p> ${imgDisplay} <div class="sort-list" id="sort_${q.id}">`;
                    let shuffledItems = [...q.items].filter(i=>i.trim()!=="").sort(() => Math.random() - 0.5);
                    shuffledItems.forEach(item => { html += `<div class="sort-item" data-val="${item}"><span class="drag-handle">⠿</span><span>${item}</span></div>`; });
                    html += `</div>`;
                }
                else if (q.type === 'group') {
                    html += `<p style="font-size: 17px; color: #2f3542;"><strong>${q.q}</strong></p> ${imgDisplay} <div class="items-container" id="group_items_${q.id}" data-qid="${q.id}">`;
                    let shuffledItems = [...q.items].filter(i=>i.txt.trim()!=="").sort(() => Math.random() - 0.5);
                    shuffledItems.forEach(item => { html += `<div class="draggable-item" data-id="${item.txt}">${item.txt}</div>`; });
                    html += `</div><div class="buckets-container"><div class="bucket"><h4 class="bucket-title" style="background:#70a1ff; color:white;">${q.b1}</h4><div class="bucket-zone" data-bucket="1" data-qid="${q.id}"></div></div><div class="bucket"><h4 class="bucket-title" style="background:#ff9a9e; color:white;">${q.b2}</h4><div class="bucket-zone" data-bucket="2" data-qid="${q.id}"></div></div></div>`;
                }
                else if (q.type === 'draw') {
                    html += `<p style="font-size: 17px; color: #2f3542;"><strong>${q.q}</strong></p> ${imgDisplay}
                            <div class="draw-container"><canvas id="canvas_${q.id}" class="drawing-board" width="600" height="300" style="max-width:100%;"></canvas>
                                <div class="draw-controls">
                                    <input type="color" id="color_${q.id}" class="color-picker" value="#ff4757" onchange="updateDrawColor('${q.id}', this.value)" title="Chọn màu">
                                    <button id="btn_pen_${q.id}" class="btn-draw-tool active" onclick="setDrawTool('${q.id}', 'pen')">✏️ Bút vẽ</button>
                                    <button id="btn_fill_${q.id}" class="btn-draw-tool" onclick="setDrawTool('${q.id}', 'fill')">🪣 Tô màu</button>
                                    <button class="btn-clear-draw" onclick="clearCanvas('canvas_${q.id}')">🔄 Xóa lại</button>
                                </div>
                            </div>`;
                }
                html += `</div>`;
            });

            html += `<button class="submit-btn" onclick="gradeTest()">🎉 NỘP BÀI VÀ XEM ĐIỂM 🎉</button></div>`;
            app.innerHTML = html;

            lessonData.questions.forEach(q => { if(q.type === 'draw') initCanvas(`canvas_${q.id}`); });
            setTimeout(initSortableJS, 150); 
        }

        window.selectSingle = function(qId, btn, val) {
            let btns = document.getElementById(qId).getElementsByClassName("option-btn");
            for(let i=0; i<btns.length; i++) btns[i].classList.remove("selected");
            btn.classList.add("selected"); userAnswers[qId] = val;
        }
        window.toggleMulti = function(qId, btn, val) {
            let arr = userAnswers[qId];
            if(arr.includes(val)) { arr.splice(arr.indexOf(val), 1); btn.classList.remove("multi-selected"); btn.innerHTML = btn.innerHTML.replace("✅", "⬜"); } 
            else { arr.push(val); btn.classList.add("multi-selected"); btn.innerHTML = btn.innerHTML.replace("⬜", "✅"); }
        }

        function initSortableJS() {
            if(typeof Sortable === 'undefined') { setTimeout(initSortableJS, 200); return; }
            document.querySelectorAll('.sort-list').forEach(list => { new Sortable(list, { animation: 150, ghostClass: 'sortable-ghost', dragClass: 'sortable-drag', delay: 50, delayOnTouchOnly: true }); });
            lessonData.questions.forEach(q => {
                if(q.type === 'group') {
                    let groupOptions = { group: 'shared_' + q.id, animation: 150, ghostClass: 'sortable-ghost', dragClass: 'sortable-drag', delay: 50, delayOnTouchOnly: true };
                    let container = document.getElementById('group_items_' + q.id);
                    if(container) new Sortable(container, groupOptions);
                    document.querySelectorAll(`.bucket-zone[data-qid="${q.id}"]`).forEach(zone => { new Sortable(zone, groupOptions); });
                }
            });
        }

        const canvasMemory = {};
        window.updateDrawColor = function(id, color) { if(canvasMemory['canvas_'+id]) canvasMemory['canvas_'+id].color = color; }
        window.setDrawTool = function(id, tool) {
            if(canvasMemory['canvas_'+id]) { canvasMemory['canvas_'+id].tool = tool; document.getElementById('btn_pen_'+id).classList.remove('active'); document.getElementById('btn_fill_'+id).classList.remove('active'); document.getElementById('btn_'+tool+'_'+id).classList.add('active'); }
        }
        function floodFill(ctx, startX, startY, fillColorHex) {
            const canvasWidth = ctx.canvas.width; const canvasHeight = ctx.canvas.height;
            const imageData = ctx.getImageData(0, 0, canvasWidth, canvasHeight); const data = imageData.data;
            const getPixelPos = (x, y) => (y * canvasWidth + x) * 4;
            const startPos = getPixelPos(startX, startY);
            const startR = data[startPos]; const startG = data[startPos + 1]; const startB = data[startPos + 2]; const startA = data[startPos + 3];
            let hex = fillColorHex.replace('#', ''); if (hex.length === 3) hex = hex.split('').map(c => c+c).join('');
            const r = parseInt(hex.substring(0, 2), 16); const g = parseInt(hex.substring(2, 4), 16); const b = parseInt(hex.substring(4, 6), 16); const a = 255;
            if (startR === r && startG === g && startB === b && startA === a) return;
            const matchStartColor = (pos) => (data[pos] === startR && data[pos + 1] === startG && data[pos + 2] === startB && data[pos + 3] === startA);
            const colorPixel = (pos) => { data[pos] = r; data[pos + 1] = g; data[pos + 2] = b; data[pos + 3] = a; };
            const pixelStack = [[startX, startY]];
            while (pixelStack.length) {
                const newPos = pixelStack.pop(); let x = newPos[0]; let y = newPos[1]; let pixelPos = getPixelPos(x, y);
                while (y-- >= 0 && matchStartColor(pixelPos)) { pixelPos -= canvasWidth * 4; }
                pixelPos += canvasWidth * 4; ++y; let reachLeft = false; let reachRight = false;
                while (y++ < canvasHeight - 1 && matchStartColor(pixelPos)) {
                    colorPixel(pixelPos);
                    if (x > 0) { if (matchStartColor(pixelPos - 4)) { if (!reachLeft) { pixelStack.push([x - 1, y]); reachLeft = true; } } else if (reachLeft) { reachLeft = false; } }
                    if (x < canvasWidth - 1) { if (matchStartColor(pixelPos + 4)) { if (!reachRight) { pixelStack.push([x + 1, y]); reachRight = true; } } else if (reachRight) { reachRight = false; } }
                    pixelPos += canvasWidth * 4;
                }
            }
            ctx.putImageData(imageData, 0, 0);
        }
        function initCanvas(id) {
            let canvas = document.getElementById(id); if(!canvas) return; let ctx = canvas.getContext('2d');
            ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, canvas.width, canvas.height);
            canvasMemory[id] = { ctx: ctx, touched: false, color: '#ff4757', tool: 'pen' }; let painting = false;
            function getPos(e) {
                let rect = canvas.getBoundingClientRect(); let clientX = e.clientX || (e.touches && e.touches[0].clientX); let clientY = e.clientY || (e.touches && e.touches[0].clientY);
                let scaleX = canvas.width / rect.width; let scaleY = canvas.height / rect.height; return { x: Math.floor((clientX - rect.left) * scaleX), y: Math.floor((clientY - rect.top) * scaleY) };
            }
            function startPos(e) { 
                if(isSubmitted) return; let mem = canvasMemory[id]; mem.touched = true; let pos = getPos(e);
                if(mem.tool === 'fill') { floodFill(ctx, pos.x, pos.y, mem.color); return; } painting = true; draw(e); 
            }
            function endPos() { painting = false; ctx.beginPath(); }
            function draw(e) {
                let mem = canvasMemory[id]; if(!painting || mem.tool !== 'pen' || isSubmitted) return;
                e.preventDefault(); let pos = getPos(e);
                ctx.lineWidth = 6; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = mem.color;
                ctx.lineTo(pos.x, pos.y); ctx.stroke(); ctx.beginPath(); ctx.moveTo(pos.x, pos.y);
            }
            canvas.addEventListener('mousedown', startPos); canvas.addEventListener('mouseup', endPos); canvas.addEventListener('mousemove', draw); canvas.addEventListener('mouseleave', endPos);
            canvas.addEventListener('touchstart', startPos, {passive:false}); canvas.addEventListener('touchend', endPos); 
            canvas.addEventListener('touchmove', function(e){ if(painting){ e.preventDefault(); draw(e); } }, {passive:false});
        }
        window.clearCanvas = function(id) {
            if(isSubmitted) return; let canvas = document.getElementById(id); let mem = canvasMemory[id];
            if(canvas && mem) { mem.ctx.fillStyle = "#ffffff"; mem.ctx.fillRect(0, 0, canvas.width, canvas.height); mem.touched = false; }
        }

        window.gradeTest = function() {
            if(isSubmitted) return; 
            isSubmitted = true;
            document.getElementById('timerDisplay').style.display = 'none';

            let name = document.getElementById('studentName').value || "Bạn nhỏ";
            let tenLop = document.getElementById('studentClass').value || "Chưa nhập"; 
            
            let earnedScore = 0; let maxScore = 0; 
            let countCorrect = 0; let countWrong = 0; let countUnanswered = 0;
            let reviewHTML = ""; 

            lessonData.questions.forEach((q, i) => {
                let isCorrect = false; let rHTML = ""; 
                let explHtml = (q.expl && q.expl.trim() !== "") ? `<div class="r-expl">💡 <b>Giải thích:</b> ${q.expl}</div>` : "";
                let qPts = parseFloat(q.pts) || 0;
                if (q.type !== 'draw') maxScore += qPts;

                if (q.type === 'single') {
                    let sAns = userAnswers[q.id]; if (sAns === undefined) countUnanswered++;
                    isCorrect = (sAns === q.ans); if(isCorrect) { earnedScore += qPts; countCorrect++; } else { countWrong++; }
                    let sAnsText = sAns !== undefined ? q.opts[sAns] : "Chưa chọn";
                    rHTML = `<div class="r-question">Câu ${i+1}: ${q.q}</div><div class="r-student">Em chọn: <b>${sAnsText}</b> ${isCorrect?'✅':'❌'}</div>${!isCorrect?`<div class="r-correct">👉 Đúng là: ${q.opts[q.ans]}</div>`:''}`;
                } 
                else if (q.type === 'multi') {
                    let sAnsArr = userAnswers[q.id] ? userAnswers[q.id].slice().sort() : []; if (sAnsArr.length === 0) countUnanswered++;
                    let cAnsArr = q.ans.slice().sort();
                    isCorrect = (JSON.stringify(sAnsArr) === JSON.stringify(cAnsArr)); 
                    if(isCorrect) { earnedScore += qPts; countCorrect++; } else { countWrong++; }
                    let sAnsText = sAnsArr.length > 0 ? sAnsArr.map(idx => q.opts[idx]).join(" | ") : "Chưa chọn"; let cAnsText = cAnsArr.map(idx => q.opts[idx]).join(" | ");
                    rHTML = `<div class="r-question">Câu ${i+1}: ${q.q}</div><div class="r-student">Em chọn: <b>${sAnsText}</b> ${isCorrect?'✅':'❌'}</div>${!isCorrect?`<div class="r-correct">👉 Đúng là: ${cAnsText}</div>`:''}`;
                }
                else if (q.type === 'fill') {
                    let inputVal = document.getElementById(q.id).value.trim(); if (inputVal === "") countUnanswered++;
                    isCorrect = (normalizeVN(inputVal) === normalizeVN(q.ans)); 
                    if(isCorrect && inputVal !== "") { earnedScore += qPts; countCorrect++; } else { countWrong++; }
                    rHTML = `<div class="r-question">Câu ${i+1}: ${q.pre} ___ ${q.post}</div><div class="r-student">Em điền: <b>${inputVal||"Trống"}</b> ${isCorrect?'✅':'❌'}</div>${!isCorrect?`<div class="r-correct">👉 Cần điền: ${q.ans}</div>`:''}`;
                }
                else if (q.type === 'typing') {
                    let editorEl = document.getElementById(q.id);
                    let inputVal = editorEl.innerText || editorEl.textContent; 
                    let formattedHTML = editorEl.innerHTML; 

                    // Tách chữ thuần từ văn bản mẫu của Giáo viên (Bỏ qua các thẻ HTML định dạng)
                    let tempDiv = document.createElement("div");
                    tempDiv.innerHTML = q.sample;
                    let plainSample = tempDiv.innerText || tempDiv.textContent;

                    // 1. CHẤM MỨC ĐỘ HOÀN THÀNH CHỮ (50% ĐIỂM)
                    let s1 = normalizeVN(plainSample).split(" ").filter(x=>x);
                    let s2 = normalizeVN(inputVal).split(" ").filter(x=>x);
                    let matchCount = 0;
                    s1.forEach(w => { 
                        let idx = s2.indexOf(w);
                        if(idx !== -1) { matchCount++; s2.splice(idx, 1); } 
                    });
                    let textCompletionRatio = s1.length > 0 ? matchCount / s1.length : 0;
                    if (textCompletionRatio > 1) textCompletionRatio = 1;

                    // 2. CHẤM ĐIỂM ĐỊNH DẠNG (50% ĐIỂM)
                    let activeCriteria = 0;
                    let metCriteria = 0;
                    let criteriaResults = [];

                    if (q.reqBold) {
                        activeCriteria++;
                        if (/<(b|strong)>|font-weight:\s*(bold|[789]00)/i.test(formattedHTML)) { metCriteria++; criteriaResults.push("✅ In đậm"); }
                        else { criteriaResults.push("❌ Bỏ sót In đậm"); }
                    }
                    if (q.reqItalic) {
                        activeCriteria++;
                        if (/<(i|em)>|font-style:\s*italic/i.test(formattedHTML)) { metCriteria++; criteriaResults.push("✅ In nghiêng"); }
                        else { criteriaResults.push("❌ Bỏ sót In nghiêng"); }
                    }
                    if (q.reqUnderline) {
                        activeCriteria++;
                        if (/<u\b|text-decoration:\s*underline/i.test(formattedHTML)) { metCriteria++; criteriaResults.push("✅ Gạch chân"); }
                        else { criteriaResults.push("❌ Bỏ sót Gạch chân"); }
                    }
                    if (q.reqColor) {
                        activeCriteria++;
                        if (/(color\s*=|color:\s*)/i.test(formattedHTML)) { metCriteria++; criteriaResults.push("✅ Đổi màu"); }
                        else { criteriaResults.push("❌ Chưa đổi màu"); }
                    }
                    if (q.reqAlign) {
                        activeCriteria++;
                        let alignRegex = new RegExp(`text-align:\\s*${q.reqAlign}|align=["']?${q.reqAlign}["']?`, "i");
                        if (alignRegex.test(formattedHTML)) { metCriteria++; criteriaResults.push(`✅ Căn lề`); }
                        else { criteriaResults.push(`❌ Lỗi căn lề`); }
                    }
                    if (q.reqFont) {
                        activeCriteria++;
                        if (formattedHTML.toLowerCase().includes(q.reqFont.toLowerCase())) { 
                            metCriteria++; criteriaResults.push(`✅ Phông chữ`); 
                        } else { 
                            criteriaResults.push(`❌ Lỗi Phông chữ`); 
                        }
                    }

                    // TỔNG HỢP ĐIỂM
                    let textPoints = qPts;
                    let formatPoints = 0;
                    if (activeCriteria > 0) {
                        textPoints = qPts * 0.5; // Chữ 50%
                        formatPoints = qPts * 0.5; // Định dạng 50%
                    }

                    let earnedText = textCompletionRatio * textPoints;
                    let earnedFormat = activeCriteria > 0 ? (metCriteria / activeCriteria) * formatPoints : 0;
                    let totalQEarned = earnedText + earnedFormat;
                    earnedScore += totalQEarned;

                    let isTextGood = textCompletionRatio >= 0.8; // Gõ đúng trên 80% chữ coi như đạt phần chữ
                    let isFormatGood = activeCriteria === 0 || (metCriteria === activeCriteria);
                    isCorrect = isTextGood && isFormatGood;
                    
                    if (inputVal.trim() === "") countUnanswered++;
                    else if (isCorrect) countCorrect++; 
                    else countWrong++;

                    let percentageDisplay = Math.round(textCompletionRatio * 100);
                    let formatDisplay = activeCriteria > 0 ? `<br><b style="color:#3742fa;">Kiểm tra định dạng:</b> ${criteriaResults.join(" | ")}` : "";

                    rHTML = `<div class="r-question">Câu ${i+1}: ${q.q}</div>
                             <div class="r-student">Em gõ và trình bày: 
                                 <div style="border: 1px dashed #70a1ff; padding: 15px; border-radius: 8px; margin-top: 8px; background: #fff; min-height: 40px; font-size: 16px;">
                                     ${formattedHTML || "<span style='color:#a4b0be'>Trống</span>"}
                                 </div>
                                 <div style="margin-top: 10px; padding: 10px; background: #eaf1ff; border-radius: 8px; font-size: 14px; line-height: 1.6;">
                                     <b style="color:#d35400;">Mức độ hoàn thành chữ:</b> ${percentageDisplay}% ${percentageDisplay>=80?'✅':'❌'}
                                     ${formatDisplay}
                                 </div>
                             </div>
                             ${(!isTextGood)?`<div class="r-correct">👉 Nội dung chuẩn cần gõ: <br><div style="font-weight:normal; font-family:inherit;">${q.sample}</div></div>`:''}`;
                }
                else if (q.type === 'match') {
                    let validPairs = q.pairs.filter(p => p.l.trim() !== "");
                    let numPairs = validPairs.length; let correctPairs = 0;
                    validPairs.forEach((p, j) => {
                        let sVal = document.getElementById(`${q.id}_${j}`).value; if (sVal === "") countUnanswered++;
                        let isPairCorrect = (sVal === p.r); if(isPairCorrect) correctPairs++;
                        rHTML += `<div style="margin-bottom:8px;"><div class="r-question">Câu ${i+1}.${j+1}: Nối "${p.l}" với...</div>
                            <div class="r-student">Em chọn: <b>${sVal||"Trống"}</b> ${isPairCorrect?'✅':'❌'}</div>${!isPairCorrect?`<div class="r-correct">👉 Đúng là: ${p.r}</div>`:''}</div>`;
                    });
                    isCorrect = (correctPairs === numPairs);
                    if(isCorrect) countCorrect++; else countWrong++;
                    earnedScore += (correctPairs / numPairs) * qPts;
                }
                else if (q.type === 'sort') {
                    let validItems = q.items.filter(i=>i.trim()!=="");
                    let curItems = Array.from(document.getElementById(`sort_${q.id}`).querySelectorAll('.sort-item')).map(el => el.getAttribute('data-val'));
                    isCorrect = JSON.stringify(curItems) === JSON.stringify(validItems); 
                    if(isCorrect) { earnedScore += qPts; countCorrect++; } else { countWrong++; }
                    rHTML = `<div class="r-question">Câu ${i+1}: ${q.q}</div><div class="r-student">Trật tự em xếp: ${isCorrect?'✅ Chính xác':'❌ Chưa đúng thứ tự'}</div>${!isCorrect?`<div class="r-correct">👉 Thứ tự chuẩn: <br> ${validItems.map((it, idx) => `${idx+1}. ${it}`).join("<br>")}</div>`:''}`;
                }
                else if (q.type === 'group') {
                    let validItems = q.items.filter(i=>i.txt.trim()!==""); let numItems = validItems.length; let correctItems = 0; let wrongItemsArr = [];
                    let unassigned = document.getElementById('group_items_'+q.id).children.length; if (unassigned === numItems) countUnanswered++; 
                    
                    let elems = Array.from(document.querySelectorAll(`.bucket-zone[data-qid="${q.id}"] .draggable-item`));
                    validItems.forEach(item => {
                        let el = elems.find(e => e.getAttribute('data-id') === item.txt);
                        let bucket = el ? el.closest('.bucket-zone') : null;
                        let bucketId = bucket ? parseInt(bucket.getAttribute('data-bucket')) : 0;
                        if(bucketId === item.b) correctItems++; else wrongItemsArr.push(item.txt);
                    });
                    
                    isCorrect = (correctItems === numItems);
                    if(isCorrect) countCorrect++; else countWrong++;
                    earnedScore += (correctItems / numItems) * qPts;
                    rHTML = `<div class="r-question">Câu ${i+1}: ${q.q}</div><div class="r-student">Phân loại: ${isCorrect?'✅ Hoàn toàn chính xác':'❌ Sai vị trí các thẻ: '+wrongItemsArr.join(", ")}</div>`;
                }
                else if (q.type === 'draw') {
                    let isDrawn = canvasMemory[`canvas_${q.id}`] ? canvasMemory[`canvas_${q.id}`].touched : false;
                    let remark = isDrawn ? "Tuyệt vời! Em đã hoàn thành bức vẽ rất sáng tạo 🎨🌟" : "Em chưa vẽ hình, hãy thử sức ở lần sau nhé! 😉";
                    rHTML = `<div class="r-question">Câu ${i+1}: ${q.q}</div><div class="r-student">Nhận xét: <b style="color:#2f3542;">${remark}</b></div>`;
                    reviewHTML += `<div class="review-item" style="border-left-color:#2ed573; background:#e0f8e9;">${rHTML}</div>`;
                    return; 
                }

                if(q.type !== 'match') { reviewHTML += `<div class="review-item ${isCorrect ? 'item-correct' : 'item-wrong'}">${rHTML}${explHtml}</div>`; } 
                else { reviewHTML += `<div class="review-item" style="border-left-color:#70a1ff">${rHTML}${explHtml}</div>`; }
            });

            let submitBtn = document.querySelector('.submit-btn');
            if(submitBtn) { submitBtn.innerHTML = "⏳ Đang nộp bài và lưu điểm..."; submitBtn.disabled = true; submitBtn.style.opacity = "0.8"; }

            let formattedEarned = parseFloat(earnedScore.toFixed(2));
            
            const postData = { hoTen: name, lop: tenLop, diem: formattedEarned, soCauDung: countCorrect, soCauSai: countWrong, soCauChuaLam: countUnanswered, tongSoCau: maxScore };
            
            const scriptURL = 'https://docs.google.com/spreadsheets/d/18Y72JfRyIzoLXDeVeLgOL06YyxxghyOlp_oSpMIRCgw/edit?pli=1&gid=0#gid=0';

            fetch(scriptURL, { method: 'POST', body: JSON.stringify(postData), headers: { 'Content-Type': 'text/plain;charset=utf-8' }})
            .then(response => response.json()).then(data => console.log("Lưu thành công!"))
            .catch(error => console.error("Lỗi:", error))
            .finally(() => {
                let isPerfect = formattedEarned >= maxScore && maxScore > 0;
                let circleClass = isPerfect ? 'score-perfect' : (formattedEarned >= maxScore/2 ? 'score-good' : 'score-try');
                let message = isPerfect ? `Tuyệt vời! 🏆<br>Chúc mừng ${name}!` : (formattedEarned >= maxScore/2 ? `Làm tốt lắm ${name}! 🌟` : `Cố gắng lên ${name} nhé! 🌱`);

                let resultUI = `
                    <div class="result-screen">
                        <h1 style="color: #ff6b81; font-size:35px; text-shadow:none;">KẾT QUẢ BÀI LÀM</h1>
                        <div class="score-circle ${circleClass}" style="flex-direction:column; font-size:35px;">
                            ${formattedEarned}<span style="font-size:16px;">/ ${maxScore}</span>
                        </div>
                        <h2 style="color: #2f3542;">${message}</h2>
                        <div class="review-container"><h3 class="section-title">📋 Chi tiết bài làm:</h3>${reviewHTML}</div>
                    </div>
                `;
                document.getElementById('app').innerHTML = resultUI;
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        }

        window.onload = renderApp;
    </script>
